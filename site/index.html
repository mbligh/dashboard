<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <meta name="description" content="Recent GitHub Actions runs across mbligh public repositories">
  <title>Actions Dashboard · mbligh</title>
  <link rel="stylesheet" href="./style.css">
  <script src="./app.js" defer></script>
</head>
<body>
  <div class="shell">
    <header class="top">
      <div>
        <div class="eyebrow">MBLIGH / GITHUB</div>
        <h1>Actions dashboard</h1>
        <p class="muted">Latest run of each workflow across public repositories.</p>
      </div>
      <div class="header-actions">
        <div id="freshness" class="freshness" role="status">Loading snapshot…</div>
        <button id="refresh" class="refresh" type="button">Refresh</button>
      </div>
    </header>
    <section id="summary" class="summary" aria-label="Workflow summary"></section>
    <section class="controls" aria-label="Filters">
      <label class="search-label">
        <span>Search</span>
        <input id="search" type="search" placeholder="Repository or workflow name" autocomplete="off">
      </label>
      <label>
        <span>Status</span>
        <select id="filter">
          <option value="all">All statuses</option>
          <option value="attention">Needs attention</option>
          <option value="running">Running / queued</option>
          <option value="success">Successful</option>
          <option value="never">Never run</option>
        </select>
      </label>
      <label class="toggle"><input id="empty" type="checkbox"> Show repositories without workflows</label>
    </section>
    <main id="repos" aria-live="polite">
      <p class="placeholder">Loading the latest workflow snapshot…</p>
    </main>
    <footer>
      Public repositories only. Snapshot generated by GitHub Actions approximately every 15 minutes.
      <a href="https://github.com/mbligh/dashboard">Source and setup</a>
    </footer>
  </div>
</body>
</html>
