name: Publish Actions Dashboard

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * *" # Daily baseline reconciliation at 05:17 UTC
  workflow_dispatch:
  # Optional: GitHub App/webhook receivers may dispatch this event.
  repository_dispatch:
    types: [refresh-dashboard]

permissions:
  actions: read  # Check the uploaded artifact is visible to the Pages deployment API
  contents: read
  pages: write
  id-token: write

concurrency:
  group: dashboard-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Install YAML parser
        run: python3 -m pip install --disable-pip-version-check "PyYAML>=6,<7"
      - name: Test collector
        run: python3 -m unittest discover -s tests -v
      - name: Test Cloudflare webhook Worker
        run: node --test worker/test/*.test.mjs
      - name: Syntax-check trigger graph page
        run: node --check site/repo.js
      - name: Test browser graph relationships
        run: node --test tests/test_graph_browser.cjs
      - name: Collect latest public workflow runs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DASHBOARD_READ_TOKEN: ${{ secrets.DASHBOARD_READ_TOKEN }}
        run: python3 scripts/collect --owner mbligh --output site/status.json
      - name: Extract workflow trigger relationships
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DASHBOARD_READ_TOKEN: ${{ secrets.DASHBOARD_READ_TOKEN }}
        run: python3 scripts/graph --snapshot site/status.json
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        id: upload
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Wait for uploaded Pages artifact
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        run: |
          set -euo pipefail
          if [[ ! "$ARTIFACT_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::Pages upload did not return an artifact ID"
            exit 1
          fi
          for attempt in {1..12}; do
            if ids=$(timeout 10s gh api --method GET \
                "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
                -f name=github-pages \
                --jq '.artifacts[] | select(.name == "github-pages" and .expired == false) | .id') &&
                grep -Fxq "$ARTIFACT_ID" <<< "$ids"; then
              echo "Pages artifact $ARTIFACT_ID is visible (attempt $attempt)"
              exit 0
            fi
            echo "Pages artifact $ARTIFACT_ID not visible yet (attempt $attempt/12)"
            if (( attempt < 12 )); then sleep 5; fi
          done
          echo "::error::Uploaded Pages artifact $ARTIFACT_ID did not become visible after 12 attempts"
          exit 1
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
