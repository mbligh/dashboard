name: Publish Actions Dashboard

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * *" # Daily baseline reconciliation at 05:17 UTC
  workflow_dispatch:
  # Optional: GitHub App/webhook receivers may dispatch this event.
  repository_dispatch:
    types: [refresh-dashboard]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: dashboard-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Install YAML parser
        run: python3 -m pip install --disable-pip-version-check "PyYAML>=6,<7"
      - name: Test collector
        run: python3 -m unittest discover -s tests -v
      - name: Test Cloudflare webhook Worker
        run: node --test worker/test/*.test.mjs
      - name: Syntax-check trigger graph page
        run: node --check site/repo.js
      - name: Collect latest public workflow runs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DASHBOARD_READ_TOKEN: ${{ secrets.DASHBOARD_READ_TOKEN }}
        run: python3 scripts/collect --owner mbligh --output site/status.json
      - name: Extract workflow trigger relationships
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DASHBOARD_READ_TOKEN: ${{ secrets.DASHBOARD_READ_TOKEN }}
        run: python3 scripts/graph --snapshot site/status.json
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
